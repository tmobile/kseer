kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kseer-test-1
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "cluster=test-1,environment=development"
  - role: worker
    image: kindest/node:v1.31.0
    kubeadmConfigPatches:
    - |
      kind: JoinConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "cluster=test-1,environment=development"
networking:
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
