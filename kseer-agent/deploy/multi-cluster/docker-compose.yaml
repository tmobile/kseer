version: '3.8'

services:
  kseer-agent:
    image: kseer/kseer-agent:latest
    container_name: kseer-agent
    restart: unless-stopped
    
    # Mount configuration and kubeconfig files
    volumes:
      - ./config.yaml:/etc/kseer-agent/config.yaml:ro
      - ./kubeconfigs:/kubeconfigs:ro
      # Optional: mount credentials
      # - ./credentials:/credentials:ro
    
    # Environment variables
    environment:
      - LOG_LEVEL=info
      - KSEER_MODE=multi-cluster
    
    # Network mode
    network_mode: bridge
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "kseer-agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

