{{- if and (eq .Values.mode "in-cluster") .Values.outputs.clickhouse.enabled .Values.externalSecret.enabled -}}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName | default (printf "%s-vault" (include "kseer-agent.fullname" .)) }}
  namespace: {{ include "kseer-agent.namespace" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ required "externalSecret.vaultServer is required when externalSecret.enabled=true" .Values.externalSecret.vaultServer | quote }}
      path: {{ .Values.externalSecret.vaultMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ required "externalSecret.vaultAuthMountPath is required when externalSecret.enabled=true" .Values.externalSecret.vaultAuthMountPath | quote }}
          role: {{ required "externalSecret.vaultRole is required when externalSecret.enabled=true" .Values.externalSecret.vaultRole | quote }}
          serviceAccountRef:
            name: {{ include "kseer-agent.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.outputs.clickhouse.credentialsSecret.name | default (printf "%s-clickhouse" (include "kseer-agent.fullname" .)) }}
  namespace: {{ include "kseer-agent.namespace" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName | default (printf "%s-vault" (include "kseer-agent.fullname" .)) }}
    kind: SecretStore
  target:
    name: {{ .Values.outputs.clickhouse.credentialsSecret.name | default (printf "%s-clickhouse" (include "kseer-agent.fullname" .)) }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath | quote }}
        property: password
{{- end }}
