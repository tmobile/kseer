{{- if eq .Values.mode "in-cluster" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kseer-agent.fullname" . }}
  namespace: {{ include "kseer-agent.namespace" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kseer-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kseer-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kseer-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /usr/local/bin/kseer-agent
        args:
          - --config=/etc/kseer-agent/config.yaml
        env:
          - name: KSEER_MODE
            value: {{ .Values.mode | quote }}
          {{- if .Values.logging.level }}
          - name: LOG_LEVEL
            value: {{ .Values.logging.level | quote }}
          {{- end }}
          {{- if .Values.outputs.clickhouse.enabled }}
          - name: KSEER_CLICKHOUSE_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.outputs.clickhouse.credentialsSecret.name | default (printf "%s-clickhouse" (include "kseer-agent.fullname" .)) }}
                key: username
          - name: KSEER_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.outputs.clickhouse.credentialsSecret.name | default (printf "%s-clickhouse" (include "kseer-agent.fullname" .)) }}
                key: password
          {{- end }}
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        volumeMounts:
          - name: config
            mountPath: /etc/kseer-agent
            readOnly: true
          - name: tmp
            mountPath: /tmp
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f kseer-agent
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f kseer-agent
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: {{ include "kseer-agent.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
