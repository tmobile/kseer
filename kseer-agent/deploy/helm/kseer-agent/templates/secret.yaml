{{- if eq .Values.mode "multi-cluster" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kseer-agent.serviceAccountName" . }}-token-{{ .Values.tokenSecret.suffix }}
  namespace: {{ include "kseer-agent.namespace" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "kseer-agent.serviceAccountName" . }}
    helm.sh/resource-policy: keep
type: kubernetes.io/service-account-token
{{- end }}
