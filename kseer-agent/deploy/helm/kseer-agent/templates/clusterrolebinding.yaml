{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ default (include "kseer-agent.fullname" .) .Values.rbac.clusterRoleBindingName }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ default (include "kseer-agent.fullname" .) .Values.rbac.clusterRoleName }}
subjects:
- kind: ServiceAccount
  name: {{ include "kseer-agent.serviceAccountName" . }}
  namespace: {{ include "kseer-agent.namespace" . }}
{{- end }}

