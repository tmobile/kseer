{{- if and (eq .Values.mode "in-cluster") .Values.outputs.clickhouse.enabled .Values.outputs.clickhouse.credentialsSecret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.outputs.clickhouse.credentialsSecret.name | default (printf "%s-clickhouse" (include "kseer-agent.fullname" .)) }}
  namespace: {{ include "kseer-agent.namespace" . }}
  labels:
    {{- include "kseer-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.outputs.clickhouse.username | quote }}
  password: {{ .Values.outputs.clickhouse.password | quote }}
{{- end }}
