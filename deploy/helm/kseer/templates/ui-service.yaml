{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kseer.ui.fullname" . }}
  labels:
    {{- include "kseer.labels" (dict "root" $ "component" "ui" "values" .Values.ui "kind" "service") | nindent 4 }}
  {{- with (include "kseer.annotations" (dict "root" $ "values" .Values.ui "kind" "service")) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kseer.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
{{- end }}
