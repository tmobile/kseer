{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kseer.clickhouse.fullname" . }}
  labels:
    {{- include "kseer.labels" (dict "root" $ "component" "clickhouse" "values" .Values.clickhouse "kind" "service") | nindent 4 }}
  {{- with (include "kseer.annotations" (dict "root" $ "values" .Values.clickhouse "kind" "service")) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.clickhouse.service.type }}
  ports:
    # HTTP interface: the schema Job and the UI's nginx proxy use this.
    - name: http
      port: {{ .Values.clickhouse.service.httpPort }}
      targetPort: http
      protocol: TCP
    # Native protocol: the agent uses this.
    - name: native
      port: {{ .Values.clickhouse.service.nativePort }}
      targetPort: native
      protocol: TCP
  selector:
    {{- include "kseer.selectorLabels" (dict "root" $ "component" "clickhouse") | nindent 4 }}
{{- end }}
