{{- if eq (include "kseer.schema.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kseer.schema.fullname" . }}
  labels:
    {{- include "kseer.labels" (dict "root" $ "component" "schema" "values" .Values.schema "kind" "deployment") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.schema.clickhouse.auth.username | quote }}
  password: {{ .Values.schema.clickhouse.auth.password | quote }}
{{- end }}
