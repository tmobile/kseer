{{- if and .Values.clickhouse.enabled (not .Values.clickhouse.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kseer.clickhouse.fullname" . }}
  labels:
    {{- include "kseer.labels" (dict "root" $ "component" "clickhouse" "values" .Values.clickhouse "kind" "deployment") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.clickhouse.auth.username | quote }}
  password: {{ .Values.clickhouse.auth.password | quote }}
{{- end }}
